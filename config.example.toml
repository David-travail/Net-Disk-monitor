# Modele de configuration : copier ce fichier en config.toml puis renseigner
# les identifiants Telegram. config.toml n'est pas versionne (il contient des secrets).

# Surveillance disque.
activer_surveillance_disque = true
intervalle_scrutation_disque_secondes = 60
seuil_alerte_disque_pourcentage = 85.0

# Telegram reste desactive si les deux champs sont vides.
jeton_bot_telegram = ""
identifiant_chat_telegram = ""
delai_http_telegram_secondes = 10

# Surveillance des appareils presents dans la table ARP locale.
activer_surveillance_reseau = true
intervalle_scrutation_reseau_secondes = 30
# Alerte Telegram lorsqu'un appareil jamais vu depuis le demarrage du moteur apparait.
alerte_nouvel_appareil_telegram = true
# Message Telegram au demarrage et a l'arret du moteur et de l'IHM.
alerte_demarrage_arret_telegram = true
# Message Telegram a chaque connexion/deconnexion d'un appareil (apres le premier scan).
alerte_connexion_deconnexion_telegram = true
# Nombre de scans consecutifs sans reponse avant de declarer un appareil deconnecte.
# Delai de detection d'un depart : environ ce nombre x intervalle_scrutation_reseau_secondes.
scans_manques_avant_deconnexion = 2

# Journal reseau : network_events.log contient les evenements du jour. Au demarrage du
# moteur et a minuit, il est archive en network_events_AAAA-MM-JJ.log ; les archives
# plus anciennes que ce nombre de jours sont supprimees.
duree_conservation_journaux_jours = 10

# Analyse des gros fichiers : taille minimale en Mio et nombre maximal de resultats.
taille_min_fichier_volumineux_mio = 100
nombre_max_fichiers_volumineux = 100

# Ecoute TCP du moteur. Garder 127.0.0.1 pour un acces sur cette machine uniquement.
adresse_ecoute_moteur = "127.0.0.1:7878"

# Adresse utilisee par l'IHM pour joindre le moteur.
# Pour un moteur distant, renseigner ici son adresse IP et son port.
adresse_moteur = "127.0.0.1:7878"

# Actualisation de l'IHM et dimensions initiales/minimales de sa fenetre.
intervalle_actualisation_ihm_secondes = 3
largeur_fenetre_ihm = 900.0
hauteur_fenetre_ihm = 760.0
largeur_min_fenetre_ihm = 680.0
hauteur_min_fenetre_ihm = 520.0
